# Updates @rudof/rudof to its latest release on npm: once a day, when run by
# hand, or right away when rudof's release workflow sends a repository_dispatch
# of type rudof-released. The update is tested before it is pushed to main, and
# then gh-pages.yml is started to test it again and publish the page (pushes
# made with GITHUB_TOKEN don't start workflows, a workflow_dispatch does).
name: update-rudof

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [rudof-released]

permissions:
  contents: read

concurrency:
  group: update-rudof
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Find the latest release
        id: version
        run: |
          current=$(node -p 'require("./package.json").devDependencies["@rudof/rudof"]')
          latest=$(npm view @rudof/rudof version)
          echo "current=$current" >> "$GITHUB_OUTPUT"
          echo "latest=$latest" >> "$GITHUB_OUTPUT"
          if [ "$current" = "$latest" ]; then
            echo "@rudof/rudof $current is the latest release"
          else
            echo "@rudof/rudof $current -> $latest"
          fi

      - name: Update package.json and package-lock.json
        if: steps.version.outputs.current != steps.version.outputs.latest
        run: npm install --save-dev --save-exact "@rudof/rudof@${{ steps.version.outputs.latest }}"

      - name: Test
        if: steps.version.outputs.current != steps.version.outputs.latest
        run: |
          npm ci
          npm test
          npm run build
          npx playwright install --with-deps chromium
          npm run test:e2e

      - name: Keep the Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

      - name: Push to main and publish
        if: steps.version.outputs.current != steps.version.outputs.latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.latest }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git commit -am "Update @rudof/rudof to $VERSION"
          git push origin HEAD:main
          gh workflow run gh-pages.yml --ref main
