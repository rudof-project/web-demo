# The examples of the Generate tab: synthetic data from a schema, with rudof
# generate. The Generate tab reads this manifest, and the Examples menu
# opens it (?manifestURL=examples/generate/manifest.yml).
#
# Each section is an example (its id names it in permalinks: gen-example=…),
# written in SHACL, ShEx and PGSchema: the three schemas say the same, over
# the RDF encoding of a property graph, so they generate the same graph. Each
# entry of a section is a kind of data (kind: …, data-kind=… in permalinks):
# the configuration of the generator (TOML, version 2).
#
#   action: generate
#   shaclURL, shexURL, pgschemaURL   the schema in each language (or shacl:,
#                                    shex:, pgschema: with the text)
#   schemaLanguage                   the language it opens in (shacl by default)
#   config                           the configuration of the generator
#   entities, seed                   how many entities, and the random seed

- section: Persons, organisations and cities (references)
  id: references
  comment: "Persons work for organisations, which are in cities: nodes that refer to other nodes."
  examples:
    - comment: "Valid data"
      action: generate
      kind: valid
      shaclURL: references.ttl
      shexURL: references.shex
      pgschemaURL: references.pgs
      config: |
        version = 2
    - comment: "Dense: every optional property, maximal cardinality"
      action: generate
      kind: dense
      shaclURL: references.ttl
      shexURL: references.shex
      pgschemaURL: references.pgs
      config: |
        version = 2

        [defaults]
        fill = 1.0
        cardinality = "max"
    - comment: "Sparse: optional properties on 10% of the nodes"
      action: generate
      kind: sparse
      shaclURL: references.ttl
      shexURL: references.shex
      pgschemaURL: references.pgs
      config: |
        version = 2

        [defaults]
        fill = 0.1
    - comment: "Coherence 0.85 (searched over the fill)"
      action: generate
      kind: coherence
      shaclURL: references.ttl
      shexURL: references.shex
      pgschemaURL: references.pgs
      config: |
        version = 2

        [targets]
        coherence = 0.85
        tolerance = 0.01
    - comment: "With errors (20%) and their report"
      action: generate
      kind: errors
      shaclURL: references.ttl
      shexURL: references.shex
      pgschemaURL: references.pgs
      config: |
        version = 2

        [violations]
        rate = 0.2

        # The RDF copy keeps PGSchema's closed records and required keys
        [violations.rdf]
        closed = true
        keys_required = true

        [output]
        formats = ["pg", "turtle"]

